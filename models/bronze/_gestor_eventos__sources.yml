version: 2

# BRONZE: landed by ADF (DeltaLoad, append). Faithful to the source: duplicates and several
# versions of the same registration are expected, so there is no unique test. Tests only warn.

sources:
  - name: gestor_eventos
    database: "{{ target.name | upper }}_BRONZE_DTP"
    schema: GESTOR_EVENTOS
    config:
      loaded_at_field: _LOADED_AT
      freshness:
        warn_after: {count: 26, period: hour}    # one missed daily run
        error_after: {count: 50, period: hour}   # two missed runs
    tables:
      - name: event_registration
        identifier: EVENT_REGISTRATION
        description: Raw copy of dbo.EVENT_REGISTRATION, one row per version received. All columns VARCHAR.
        columns:
          - name: registration_id
            data_tests: [not_null]
          - name: event_id
            data_tests: [not_null]
          - name: updated_at
            description: Watermark column. A NULL would make the row invisible to the delta load.
            data_tests: [not_null]
          - name: _loaded_at
            data_tests: [not_null]
